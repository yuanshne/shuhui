[project]
name = "shuhui-server"
version = "1.0.0"
description = "数回 联机后端"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yuanshne" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0.30",
    "redis>=5.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
]

[project.urls]
Repository = "https://github.com/yuanshne/shuhui"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# 让 `from tests.conftest import ...` 可用
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # 行长由 formatter 管，注释里的中文表格不折行

[tool.ruff.lint.flake8-bugbear]
# 路由装饰器里写 dependencies=[Depends(...)] 是 FastAPI 的标准写法，
# 但 B008 会把它当成"默认参数里调函数"报出来。这里放开这几个。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
