<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Server · 谜题后端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070f18'/%3E%3Cpath d='M6 16h6l3-7 3 14 3-7h5' stroke='%2345d6c0' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05090f; --panel:#0b131d; --panel-2:#0e1826; --line:#1b2839;
    --text:#e6edf5; --dim:#8ea0b5; --accent:#45d6c0; --gold:#e8b96a;
    --ok:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px; margin:0 auto; padding:32px 20px 64px}

  header{display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; margin-bottom:6px}
  h1{margin:0; font-size:26px; letter-spacing:.5px}
  .ver{color:var(--dim); font-size:13px}
  .sub{color:var(--dim); margin:0 0 24px; font-size:14px}

  .status{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:12.5px; color:var(--dim);
  }
  .chip b{color:var(--text); font-weight:600}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .dot.warn{background:var(--warn); box-shadow:0 0 8px var(--warn)}
  .dot.bad{background:#ef4444; box-shadow:0 0 8px #ef4444}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line); border-radius:14px; padding:18px;
  }
  .card h2{margin:0 0 2px; font-size:17px; display:flex; align-items:center; gap:8px}
  .bar{width:4px; height:18px; border-radius:2px; display:inline-block}
  .kind{font-size:11.5px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:1px 7px}
  .stats{display:flex; gap:18px; margin:14px 0 4px}
  .stat .n{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px; color:var(--dim)}
  table{width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px}
  th{text-align:left; font-weight:500; color:var(--dim); font-size:11.5px; padding:5px 0; border-bottom:1px solid var(--line)}
  td{padding:5px 0; border-bottom:1px solid rgba(27,40,57,.5); font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.r{text-align:right; color:var(--gold); font-weight:600}
  td.rank{width:28px; color:var(--dim)}
  .empty{color:var(--dim); font-size:13px; padding:10px 0}

  h3.sec{margin:36px 0 12px; font-size:17px}
  .links{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
  .links a{
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:8px 14px; font-size:13.5px;
  }
  footer{margin-top:44px; color:var(--dim); font-size:12.5px; border-top:1px solid var(--line); padding-top:16px}
  .err{background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.35); border-radius:10px;
       padding:14px 16px; color:#fca5a5; font-size:13.5px; margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Puzzle Server</h1>
    <span class="ver" id="ver">加载中…</span>
  </header>
  <p class="sub">数织 · 数回 · 立方数独 · 长夜灯 —— 四款网页游戏的统一后端。题面与答案分离，耗时由服务端计时，榜单实时推送。</p>

  <div id="error" class="err" hidden></div>
  <div class="status" id="status"></div>

  <div class="grid" id="games"></div>

  <h3 class="sec">接口入口</h3>
  <div class="links">
    <a href="/docs">交互式 API 文档</a>
    <a href="/redoc">ReDoc</a>
    <a href="/openapi.json">OpenAPI 描述</a>
    <a href="/health">健康检查</a>
  </div>

  <footer>
    榜单数据来自服务端；「实时」标记亮起时，别人上榜会立刻出现在上面。
  </footer>
</div>

<script>
const API = "/api/v1";
const $ = (sel) => document.querySelector(sel);

function esc(s){
  return String(s).replace(/[&<>"']/g, (c) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function fmt(ms){
  if (ms === null || ms === undefined) return "-";
  const s = Math.max(ms, 0) / 1000;
  const m = Math.floor(s / 60);
  return m >= 1 ? `${m}:${String((s % 60).toFixed(1)).padStart(4, "0")}` : `${s.toFixed(1)}s`;
}
async function api(path){
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
  return r.json();
}
// /health 不在 /api/v1 下面，单独走一个
async function raw(path){
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
  return r.json();
}

function chip(label, value, tone){
  return `<span class="chip"><span class="dot ${tone||""}"></span>${esc(label)} <b>${esc(value)}</b></span>`;
}

function boardRows(entries){
  if (!entries || !entries.length) return `<div class="empty">还没有人上榜</div>`;
  return `<table>
    <tr><th>#</th><th>玩家</th><th style="text-align:right">用时</th></tr>
    ${entries.map(e => `<tr>
      <td class="rank">${e.rank}</td>
      <td>${esc(e.username)}</td>
      <td class="r">${esc(e.elapsed_text)}</td>
    </tr>`).join("")}
  </table>`;
}

function renderCard(g, board){
  const rankable = g.kind === "puzzle";
  return `<div class="card">
    <h2><span class="bar" style="background:${esc(g.accent)}"></span>${esc(g.game_name)}
      <span class="kind">${rankable ? "判分游戏" : "叙事游戏"}</span></h2>
    ${rankable ? `
      <div class="stats">
        <div class="stat"><div class="n">${g.plays}</div><div class="l">累计交卷</div></div>
        <div class="stat"><div class="n">${g.solvers}</div><div class="l">解出人数</div></div>
        <div class="stat"><div class="n">${g.best_ms === null ? "-" : fmt(g.best_ms)}</div><div class="l">最好成绩</div></div>
      </div>
      <div class="l" style="color:var(--dim);font-size:11.5px;margin-top:10px">今日榜</div>
      <div class="board" data-board="${esc(g.game)}">${boardRows(board && board.entries)}</div>`
    : `
      <div class="stats">
        <div class="stat"><div class="n">${g.plays}</div><div class="l">进度上报</div></div>
      </div>
      <div class="empty">叙事类游戏不判对错，改按结局与收集度做聚合统计。</div>`}
  </div>`;
}

async function main(){
  let health, overview;
  try{
    [health, overview] = await Promise.all([raw("/health"), api("/stats/overview")]);
  }catch(err){
    $("#error").hidden = false;
    $("#error").textContent = "接口不可达：" + err.message + " —— 确认后端已启动。";
    return;
  }

  $("#ver").textContent = `v${health.version}`;
  const backendTone = (name) => (name === "redis" ? "" : "warn");
  $("#status").innerHTML = [
    chip("数据库", health.database === "ok" ? "正常" : health.database, health.database === "ok" ? "" : "bad"),
    chip("排行榜", health.leaderboard, backendTone(health.leaderboard)),
    chip("实时推送", health.realtime, backendTone(health.realtime)),
    chip("在线连接", health.live_connections),
    chip("注册用户", overview.total_users),
    chip("今日", overview.today),
  ].join("");

  const boards = {};
  await Promise.all(overview.games
    .filter(g => g.kind === "puzzle")
    .map(async g => { boards[g.game] = await api(`/leaderboard/${g.game}`).catch(() => null); }));

  $("#games").innerHTML = overview.games.map(g => renderCard(g, boards[g.game])).join("");

  // 订阅每款判分游戏的当日榜，有人上榜立刻刷新对应卡片
  overview.games.filter(g => g.kind === "puzzle").forEach(g => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    let ws;
    try{
      ws = new WebSocket(`${proto}://${location.host}/ws/leaderboard/${g.game}`);
    }catch{ return; }
    ws.onmessage = (ev) => {
      try{
        const msg = JSON.parse(ev.data);
        if (msg.type !== "leaderboard") return;
        boards[g.game] = msg;
        const target = document.querySelector(`[data-board="${g.game}"]`);
        if (target) target.innerHTML = boardRows(msg.entries);
      }catch{}
    };
  });
}
main();
</script>
</body>
</html>
